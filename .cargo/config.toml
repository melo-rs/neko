[build]
target = "x86_64-unknown-linux-none"

# TODO: implement runtime ELF relocations.
#
# The x86_64-unknown-linux-none target defaults to PIE. neko does not yet
# contain a runtime ELF relocator, but its current release build emits no
# relocations, so the resulting binary can still be loaded at an arbitrary
# address without any relocation processing.
#
# Debug builds do contain relocations and are therefore not expected to be
# independently loadable as PIE until runtime relocation support is added.
#
# KEEP THE RELEASE BUILD RELOCATION-FREE UNTIL THE RELOCATOR IS IMPLEMENTED.
# rustflags = ["-C", "relocation-model=static"]

[unstable]
build-std = ["core"]