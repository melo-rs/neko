[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"

[package]
name = "neko-rs"
description = "Minimal cat implementation written in no_std Rust with direct Linux syscalls."
version = "1.0.0"
authors = ["Davi Melo <hello@dmelo.sh>"]
edition = "2024"
license = "MIT"

[[bin]]
name = "neko"
path = "src/main.rs"

[lints.rust]
unsafe_op_in_unsafe_fn = "forbid"

[lints.clippy]
undocumented_unsafe_blocks = "forbid"

[dependencies]
